name: Score package with pana
description: >
  Set up stable Dart (or Flutter, for packages that need it), run pana on a
  package, publish a summary, and report a `pana` commit status.

inputs:
  path:
    description: Root directory of a Dart package.
    default: '.'
  report-status:
    description: Whether to report the score as a commit status.
    default: 'true'

outputs:
  score:
    description: "Package score text in the form `granted/max`."
    value: ${{ steps.score.outputs.score }}
  state:
    description: pana result state (`success`, `failure`, or `error`).
    value: ${{ steps.score.outputs.state }}
  package-name:
    description: Name resolved from the package's `pubspec.yaml` (or its directory name).
    value: ${{ steps.score.outputs.package-name }}

runs:
  using: composite

  steps:
    # Packages that depend on the Flutter SDK (`sdk: flutter` in pubspec.yaml)
    # need `flutter` on PATH: pana shells out to `flutter pub` for them, and
    # falls over hard (not just a lower score) if only plain Dart is present.
    - name: Check whether the package requires Flutter
      id: package-check
      shell: bash
      env:
        PACKAGE_PATH: ${{ inputs.path }}
      run: |
        needs_flutter=false
        if grep -qE '^\s*sdk:\s*flutter\s*$' "$PACKAGE_PATH/pubspec.yaml" 2>/dev/null; then
          needs_flutter=true
        fi
        echo "needs-flutter=$needs_flutter" >> "$GITHUB_OUTPUT"

    # Avoids re-downloading (and colliding with leftover files) when Dart is already up to date.
    - name: Check for an up-to-date stable Dart SDK
      id: dart-check
      if: steps.package-check.outputs.needs-flutter != 'true'
      shell: bash
      run: |
        latest="$(curl -fsSL https://storage.googleapis.com/dart-archive/channels/stable/release/latest/VERSION | jq -r '.version' || true)"
        version_line="$(dart --version 2>&1 || true)"
        current="$(awk '{print $4}' <<< "$version_line")"
        channel="$(awk '{print $5}' <<< "$version_line" | tr -d '()')"

        up_to_date=false
        if [ -n "$latest" ] && [ "$channel" = "stable" ] && [ "$current" = "$latest" ]; then
          up_to_date=true
        fi
        echo "up-to-date=$up_to_date" >> "$GITHUB_OUTPUT"

    - name: Clear stale Dart SDK download
      if: steps.package-check.outputs.needs-flutter != 'true' && steps.dart-check.outputs.up-to-date != 'true'
      shell: bash
      run: rm -f "$RUNNER_TEMP"/dartsdk-*.zip

    - name: Set up stable Dart for pana
      if: steps.package-check.outputs.needs-flutter != 'true' && steps.dart-check.outputs.up-to-date != 'true'
      uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
      with:
        sdk: stable # the score has to be the one pub.dev will give

    - name: Set up stable Flutter for pana
      if: steps.package-check.outputs.needs-flutter == 'true'
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: stable # the score has to be the one pub.dev will give
        cache: true

    # pana shells out to these WebP tools to score example/README screenshots.
    # Without them it doesn't error clearly, it just fails that check (or the
    # whole run) with an opaque "No such file or directory".
    # See: https://github.com/dart-lang/pana/issues/1553
    - name: Check for webp tools required by pana
      id: webp-check
      shell: bash
      run: |
        missing=false
        for tool in cwebp dwebp gif2webp webpmux webpinfo; do
          command -v "$tool" >/dev/null 2>&1 || missing=true
        done
        echo "missing=$missing" >> "$GITHUB_OUTPUT"

    - name: Install webp tools required by pana
      if: steps.webp-check.outputs.missing == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -y
        sudo apt-get install -y --no-install-recommends webp

    - name: Warn about missing webp tools
      if: steps.webp-check.outputs.missing == 'true' && runner.os != 'Linux'
      shell: bash
      run: |
        echo "::warning title=pana score::cwebp, dwebp, gif2webp, webpmux, and webpinfo are not on PATH, and this action only installs them automatically on Linux runners. pana's screenshot scoring may fail or produce incorrect deductions; install libwebp's command-line tools yourself (e.g. 'brew install webp' on macOS)."

    - name: Install pana
      shell: bash
      run: |
        dart pub global activate pana
        echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

    - name: Score package
      id: score
      shell: bash
      env:
        PACKAGE_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail # so tee doesn't mask a pana that fell over
        pana --json "$PACKAGE_PATH" | tee "$RUNNER_TEMP/pana.json" || true

        package_name="$(awk -F': *' '/^name:/{print $2; exit}' "$PACKAGE_PATH/pubspec.yaml" 2>/dev/null | tr -d "\"'")"
        if [ -z "$package_name" ]; then
          package_name="$(basename "$(cd "$PACKAGE_PATH" && pwd)")"
        fi

        granted="$(jq -r '.scores.grantedPoints // empty' "$RUNNER_TEMP/pana.json" 2>/dev/null || true)"
        max="$(jq -r '.scores.maxPoints // empty' "$RUNNER_TEMP/pana.json" 2>/dev/null || true)"

        valid_score=true
        score="${granted}/${max}"
        state=failure

        case "$granted$max" in
          '' | *[!0-9]*)
            valid_score=false
            score="pana produced no score"
            state=error
            echo "::error title=pana score::no score in pana's JSON report"
            ;;
        esac

        if [ "$valid_score" = true ] && [ "$granted" = "$max" ]; then
          state=success
        fi

        echo "score=$score" >> "$GITHUB_OUTPUT"
        echo "state=$state" >> "$GITHUB_OUTPUT"
        echo "valid_score=$valid_score" >> "$GITHUB_OUTPUT"
        echo "package-name=$package_name" >> "$GITHUB_OUTPUT"

        {
          echo "## pana score for $package_name: $score"
          echo
          jq -r '(.report.sections // [])[]
            | "- \(if .grantedPoints == .maxPoints then ":white_check_mark:" else ":x:" end) \(.title): \(.grantedPoints)/\(.maxPoints)"' \
            "$RUNNER_TEMP/pana.json" || true

          if [ "$valid_score" = true ] && [ "$granted" != "$max" ]; then
            echo
            echo '<details><summary>Deductions</summary>'
            echo
            jq -r '(.report.sections // [])[]
              | select(.grantedPoints < .maxPoints)
              | .summary' "$RUNNER_TEMP/pana.json" || true
            echo
            echo '</details>'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Report score as commit status
      if: |
        always() &&
        inputs.report-status == 'true' &&
        (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        STATE: ${{ steps.score.outputs.state || 'error' }}
        SCORE: ${{ steps.score.outputs.score || 'pana produced no score' }}
        PACKAGE_NAME: ${{ steps.score.outputs.package-name }}
        TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        context="pana"
        if [ -n "$PACKAGE_NAME" ]; then
          context="pana ($PACKAGE_NAME)"
        fi

        gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
          --silent \
          -f state="$STATE" \
          -f context="$context" \
          -f description="$SCORE" \
          -f target_url="$TARGET_URL"

    - name: Require a valid pana score
      if: steps.score.outputs.valid_score != 'true'
      shell: bash
      run: |
        echo "::error title=pana score::no score in pana's JSON report"
        exit 1
