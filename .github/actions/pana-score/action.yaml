name: Score package with pana
description: >
  Set up stable Dart, run pana on a package, publish a summary, and report a
  `pana` commit status.

inputs:
  path:
    description: Root directory of a Dart package.
    default: '.'
  report-status:
    description: Whether to report the score as a commit status.
    default: 'true'

outputs:
  score:
    description: "Package score text in the form `package-name: granted/max`."
    value: ${{ steps.score.outputs.score }}
  state:
    description: pana result state (`success`, `failure`, or `error`).
    value: ${{ steps.score.outputs.state }}

runs:
  using: composite

  steps:
    - name: Set up stable Dart for pana
      uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
      with:
        sdk: stable # the score has to be the one pub.dev will give

    - name: Install pana
      shell: bash
      run: |
        dart pub global activate pana
        echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

    - name: Score package
      id: score
      shell: bash
      env:
        PACKAGE_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail # so tee doesn't mask a pana that fell over
        pana --json "$PACKAGE_PATH" | tee "$RUNNER_TEMP/pana.json" || true

        python3 - <<'PY'
        import json
        import os
        import re
        from pathlib import Path

        package_path = os.environ["PACKAGE_PATH"]
        package_root = Path(package_path).resolve()
        package_name = package_root.name or "package"
        pubspec_path = package_root / "pubspec.yaml"
        if pubspec_path.exists():
          for line in pubspec_path.read_text(encoding="utf-8").splitlines():
            match = re.match(r"^name:\s*[\"']?([^\"'\s#]+)", line)
            if match:
              package_name = match.group(1)
              break

        score_state = "error"
        score_text = f"{package_name}: pana produced no score"
        valid_score = False
        sections = []

        try:
          with open(Path(os.environ["RUNNER_TEMP"]) / "pana.json", encoding="utf-8") as file:
            report = json.load(file)
          scores = report.get("scores") or {}
          granted = scores.get("grantedPoints")
          maximum = scores.get("maxPoints")
          sections = ((report.get("report") or {}).get("sections") or [])
          if isinstance(granted, int) and isinstance(maximum, int):
            score_text = f"{package_name}: {granted}/{maximum}"
            score_state = "success" if granted == maximum else "failure"
            valid_score = True
        except Exception:
          pass

        if not valid_score:
          print("::error title=pana score::no score in pana's JSON report")

        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
          output.write(f"score={score_text}\n")
          output.write(f"state={score_state}\n")
          output.write(f"valid_score={'true' if valid_score else 'false'}\n")

        with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
          summary.write(f"## pana score: {score_text}\n\n")
          for section in sections:
            granted = section.get("grantedPoints")
            maximum = section.get("maxPoints")
            if isinstance(granted, int) and isinstance(maximum, int):
              icon = ":white_check_mark:" if granted == maximum else ":x:"
              title = section.get("title", "")
              summary.write(f"- {icon} {title}: {granted}/{maximum}\n")

          deductions = [
            section.get("summary")
            for section in sections
            if isinstance(section.get("grantedPoints"), int)
            and isinstance(section.get("maxPoints"), int)
            and section.get("grantedPoints") < section.get("maxPoints")
            and section.get("summary")
          ]
          if deductions:
            summary.write("\n<details><summary>Deductions</summary>\n\n")
            for deduction in deductions:
              summary.write(f"{deduction}\n")
            summary.write("\n</details>\n")
        PY

    - name: Report score as commit status
      if: |
        always() &&
        inputs.report-status == 'true' &&
        (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        STATE: ${{ steps.score.outputs.state || 'error' }}
        SCORE: ${{ steps.score.outputs.score || 'pana produced no score' }}
        TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        python3 - <<'PY'
        import json
        import os
        import urllib.request

        payload = {
          "state": os.environ["STATE"],
          "context": "pana",
          "description": os.environ["SCORE"][:140],
          "target_url": os.environ["TARGET_URL"],
        }

        request = urllib.request.Request(
          url=f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['SHA']}",
          data=json.dumps(payload).encode("utf-8"),
          headers={
            "Authorization": "Bearer " + os.environ["GH_TOKEN"],
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
            "Content-Type": "application/json",
          },
          method="POST",
        )
        urllib.request.urlopen(request).read()
        PY

    - name: Require a valid pana score
      if: steps.score.outputs.valid_score != 'true'
      shell: bash
      run: |
        echo "::error title=pana score::no score in pana's JSON report"
        exit 1
